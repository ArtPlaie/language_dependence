[project]
name = "language-dependence"
version = "0.1.0"
description = "Cross-lingual safety eval harness: language-conditioned refusal and compliance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
